[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resonator-name-generator"
version = "0.1.0"
description = "Random, memorable names for detectors"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["resonator_name_generator"]

[tool.setuptools.package-data]
# The word lists are the point of the package; they have to ship with it.
resonator_name_generator = ["data/*.txt", "data/manifest.json"]
